# Default monitor settings, safe to commit — no secrets go here (those are
# environment variables, see README.md). Edit freely, or copy
# config.example.yaml to a different path and pass --config <path>.

watch_markets:
  - BTC-EUR
  - ETH-EUR

price_alerts:
  - market: BTC-EUR
    above: 80000
    below: 40000
    pct_change: 5      # alert if price moves +/-5% between checks
  - market: ETH-EUR
    pct_change: 8

portfolio_pct_change_alert: 5   # alert if total portfolio value moves +/-5%
portfolio_valuation_asset: EUR

check_interval_seconds: 300
# alert_email_to left unset here on purpose; set it via the ALERT_EMAIL_TO
# env var (or GitHub secret) instead so your address isn't committed.
db_path: data/history.db
